function color(p, maxP) {
  if (p === 0) return '#f5f5f5';
  const t = Math.min(1, p / Math.max(maxP, 1e-9));
  const r = Math.round(238 + (11 - 238) * t);
  const g = Math.round(246 + (94 - 246) * t);
  const b = Math.round(255 + (215 - 255) * t);
  return `rgb(${r},${g},${b})`;
}

function render() {
  const metric = document.querySelector('input[name="metric"]:checked').value;
  const base = document.querySelector('input[name="base"]:checked').value;
  const grid = DATA[metric];
  const R = FINALS.length, C = INITIALS.length;
  const colTotals = Array(C).fill(0);
  const rowTotals = Array(R).fill(0);
  let grand = 0;
  for (let r=0; r<R; r++) {
    for (let c=0; c<C; c++) {
      const v = grid[r][c];
      colTotals[c] += v;
      rowTotals[r] += v;
      grand += v;
    }
  }
  const pct = [];
  let maxP = 0;
  for (let r=0; r<R; r++) {
    pct[r] = [];
    for (let c=0; c<C; c++) {
      const v = grid[r][c];
      let denom = base === 'col' ? colTotals[c] : base === 'row' ? rowTotals[r] : grand;
      const p = denom ? (v / denom * 100) : 0;
      pct[r][c] = p;
      if (p > maxP) maxP = p;
    }
  }

  // header
  let head = '<th class="corner">韻母</th>';
  for (const lab of INITIALS) head += `<th>${lab}</th>`;
  document.getElementById('headrow').innerHTML = head;

  let body = '';
  for (let r=0; r<R; r++) {
    let tr = `<tr><th class="rowhead">${FINALS[r]}</th>`;
    for (let c=0; c<C; c++) {
      const v = grid[r][c];
      const p = pct[r][c];
      const style = v === 0 ? ' class="empty"' : ` style="background:${color(p, maxP)};color:${(p/maxP)>0.55?'#fff':'#111'};"`;
      const text = v === 0 ? '' : p.toFixed(2) + '%';
      tr += `<td${style} title="${INITIALS[c]} × ${FINALS[r]}：${text}">${text}</td>`;
    }
    tr += '</tr>';
    body += tr;
  }
  document.getElementById('tbody').innerHTML = body;
}

document.querySelectorAll('input[name="metric"], input[name="base"]').forEach(el => {
  el.addEventListener('change', render);
});
render();
